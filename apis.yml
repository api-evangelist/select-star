aid: select-star
name: Select Star
description: >-
  Select Star is a metadata context platform that provides an automated data
  catalog, column-level data lineage, and semantic model generation across a
  company's data infrastructure. It indexes and documents metadata from
  warehouses and BI tools (Snowflake, Databricks, BigQuery, Looker, Tableau,
  Mode, Sigma, ThoughtSpot, dbt and more) to create a single source of truth for
  both humans and AI. Select Star exposes a REST Metadata API and a hosted MCP
  server so teams can search assets, traverse lineage, manage tags and
  documentation, and make enterprise metadata AI-ready. Surfaced as a portfolio
  company of Lightspeed Venture Partners and enriched into the API Evangelist
  network.
