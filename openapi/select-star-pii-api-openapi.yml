openapi: 3.0.3
info:
  title: Select Star Metadata bi pii API
  version: 1.0.0
  x-role-system:
    description: This API uses role-based access control
    roles:
      admin: Full access to all operations
      data_manager: Can modify data and configurations
      user: Read-only access to most resources
  description: API for interacting with the Select Star system
  termsOfService: https://www.selectstar.com/terms-of-service
  contact:
    email: support@selectstar.com
  license:
    name: All Rights Reserved
tags:
- name: pii
paths:
  /v1/pii/matching/{guid}/export/:
    get:
      operationId: pii_matching_export_retrieve
      parameters:
      - in: path
        name: guid
        schema:
          type: string
          pattern: ^([a-zA-z]{2}_[a-zA-Z0-9]{22})|me|default|([a-zA-z]{2}_[a-zA-Z0-9]{22}).personal$
        required: true
      tags:
      - pii
      security:
      - JWTAuthentication: []
      - tokenAuth: []
      responses:
        '200':
          content:
            text/csv:
              schema:
                $ref: '#/components/schemas/TaggedItemsNoSubTags'
          description: ''
      description: '**Required Role:** Data Manager or Admin'
      x-role-requirements: Data Manager or Admin
components:
  schemas:
    TypeB32Enum:
      enum:
      - status
      - dbt
      type: string
      description: '* `status` - status

        * `dbt` - dbt'
    BaseDataSource:
      type: object
      properties:
        guid:
          type: string
          maxLength: 25
        type:
          $ref: '#/components/schemas/Type6b6Enum'
        name:
          type: string
          maxLength: 100
      required:
      - name
      - type
    LookMLView:
      type: object
      description: 'Adds support for reading a description from metadata

        that support modifying description'
      properties:
        guid:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
          description: Fully-qualified name of the field
        label:
          type: string
          readOnly: true
          description: Fully-qualified human-readable label of the field
        project_name:
          type: string
          readOnly: true
          nullable: true
          description: Name of project containing the view
        data_source:
          allOf:
          - $ref: '#/components/schemas/DataSourceInfo'
          readOnly: true
        external_id:
          type: string
          readOnly: true
          description: External unique identifier of this resource
        breadcrumbs:
          type: array
          items:
            $ref: '#/components/schemas/Breadcrumb'
          readOnly: true
        tagged_items:
          type: array
          items:
            $ref: '#/components/schemas/TaggedItemsLiteWithSource'
          readOnly: true
        description:
          type: string
          nullable: true
          description: Active description
        description_source:
          allOf:
          - $ref: '#/components/schemas/DescriptionSourceEnum'
          readOnly: true
          nullable: true
        user_description:
          type: string
          readOnly: true
          nullable: true
          description: User description
        user_description_author:
          allOf:
          - $ref: '#/components/schemas/UserLite'
          readOnly: true
        ai_description:
          type: string
          readOnly: true
          nullable: true
          description: AI-generated description
        ingested_description:
          type: string
          readOnly: true
          nullable: true
          description: Unmodified description from the data source
        richtext_description:
          type: string
          nullable: true
          description: Richtext formatted description. Can be in Slatejs or Draftjs format.
        explores:
          type: array
          items:
            $ref: '#/components/schemas/ExploreLabel'
          readOnly: true
        business_owner:
          $ref: '#/components/schemas/LookMLViewSerializer.GuidReferenceField.business_owner'
        technical_owner:
          $ref: '#/components/schemas/LookMLViewSerializer.GuidReferenceField.technical_owner'
        popularity:
          allOf:
          - $ref: '#/components/schemas/LookerViewPopularity'
          readOnly: true
        search_name:
          type: string
          readOnly: true
        downstream_objects_counts:
          allOf:
          - $ref: '#/components/schemas/RelatedObjectsCounts'
          readOnly: true
        upstream_objects_counts:
          allOf:
          - $ref: '#/components/schemas/RelatedObjectsCounts'
          readOnly: true
        data_types:
          allOf:
          - $ref: '#/components/schemas/BaseType'
          readOnly: true
        collections:
          type: array
          items:
            $ref: '#/components/schemas/CollectionLite'
          readOnly: true
      required:
      - ai_description
      - breadcrumbs
      - collections
      - data_source
      - data_types
      - description_source
      - downstream_objects_counts
      - explores
      - external_id
      - guid
      - ingested_description
      - label
      - name
      - popularity
      - project_name
      - search_name
      - tagged_items
      - upstream_objects_counts
      - user_description
      - user_description_author
    LookMLFieldFieldTypeEnum:
      enum:
      - measure
      - dimension
      - field_set
      type: string
      description: '* `measure` - measure

        * `dimension` - dimension

        * `field_set` - field_set'
    BaseMetadata:
      type: object
      properties:
        object_type:
          type: string
          readOnly: true
        guid:
          type: string
          readOnly: true
        name:
          type: string
          nullable: true
          readOnly: true
        breadcrumbs:
          type: array
          items:
            $ref: '#/components/schemas/Breadcrumb'
          readOnly: true
      required:
      - breadcrumbs
      - guid
      - name
      - object_type
    TaggedItemsNoSubTags:
      type: object
      properties:
        tag:
          $ref: '#/components/schemas/TagLite'
        kind:
          type: string
        suggested_source_kind:
          type: string
        suggestion_source:
          $ref: '#/components/schemas/TaggedItemsLite'
        suggestion_source_object:
          $ref: '#/components/schemas/TaggedItemsNoSubTagsSerializer.GuidReferenceField.suggestion_source_object'
        item:
          $ref: '#/components/schemas/TaggedItemsNoSubTagsSerializer.GuidReferenceField.item'
      required:
      - item
      - kind
      - suggested_source_kind
      - suggestion_source
      - suggestion_source_object
      - tag
    TaggedItemsLite:
      type: object
      description: Serializer without suggestion source
      properties:
        item:
          $ref: '#/components/schemas/TaggedItemsLiteSerializer.GuidReferenceField.item'
        guid:
          type: string
          readOnly: true
        tag:
          $ref: '#/components/schemas/TagLite'
        kind:
          type: string
        suggested_source_kind:
          type: string
      required:
      - guid
      - item
      - kind
      - suggested_source_kind
      - tag
    Breadcrumb:
      type: object
      properties:
        guid:
          type: string
          maxLength: 25
        target_guid:
          type: string
          maxLength: 256
        target_name:
          type: string
          readOnly: true
        target_object_type:
          type: string
        target_data_type:
          type: string
        target_data_source_guid:
          type: string
          nullable: true
          readOnly: true
        target_data_source_type:
          allOf:
          - $ref: '#/components/schemas/TargetDataSourceTypeEnum'
          nullable: true
        ordinal:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Ordering of breadcrumb within the table
      required:
      - target_data_source_guid
      - target_data_type
      - target_guid
      - target_name
      - target_object_type
    DescriptionSourceEnum:
      enum:
      - user
      - ingestion
      - ai
      - public_docs
      - lineage
      - downstream_lineage
      - upstream_lineage
      - similarity
      - unknown
      type: string
      description: '* `user` - User

        * `ingestion` - Ingestion

        * `ai` - Ai

        * `public_docs` - Public Docs

        * `lineage` - Lineage

        * `downstream_lineage` - Downstream Lineage

        * `upstream_lineage` - Upstream Lineage

        * `similarity` - Similarity

        * `unknown` - Unknown'
    SuggestedDescriptionSourceEnum:
      enum:
      - public_docs
      - lineage
      - downstream_lineage
      - upstream_lineage
      - similarity
      - unknown
      type: string
      description: '* `public_docs` - Public Docs

        * `lineage` - Lineage

        * `downstream_lineage` - Downstream Lineage

        * `upstream_lineage` - Upstream Lineage

        * `similarity` - Similarity

        * `unknown` - Unknown'
    TargetDataSourceTypeEnum:
      enum:
      - airflow
      - aws_s3
      - bigquery
      - data_studio
      - databricks
      - db_agent
      - db2
      - dbt
      - fivetran
      - glue
      - hex
      - looker
      - metabase
      - mode
      - monte_carlo
      - mssql
      - mysql
      - omni
      - openlineage
      - oracle
      - periscope
      - postgres
      - power_bi
      - quicksight
      - redshift
      - salesforce
      - salesforce_crma
      - sigma
      - snowflake
      - tableau
      - thoughtspot
      - trial
      - trial_redshift
      type: string
      description: '* `airflow` - Airflow

        * `aws_s3` - AWS S3

        * `bigquery` - BigQuery

        * `data_studio` - Looker Studio

        * `databricks` - Databricks

        * `db_agent` - DB Agent

        * `db2` - DB2

        * `dbt` - dbt

        * `fivetran` - Fivetran

        * `glue` - Glue

        * `hex` - Hex

        * `looker` - Looker

        * `metabase` - Metabase

        * `mode` - Mode

        * `monte_carlo` - Monte Carlo

        * `mssql` - MS SQL

        * `mysql` - MySQL

        * `omni` - Omni BI

        * `openlineage` - Open Lineage

        * `oracle` - Oracle

        * `periscope` - Periscope

        * `postgres` - PostgreSQL

        * `power_bi` - Power BI

        * `quicksight` - QuickSight

        * `redshift` - Redshift

        * `salesforce` - Salesforce

        * `salesforce_crma` - Salesforce Analytics

        * `sigma` - Sigma

        * `snowflake` - Snowflake

        * `tableau` - Tableau

        * `thoughtspot` - ThoughtSpot

        * `trial` - Trial

        * `trial_redshift` - Trial Redshift'
    TaggedItemsLiteWithSourceSerializer.GuidReferenceField.suggestion_source_object:
      anyOf:
      - $ref: '#/components/schemas/PiiRule'
      - $ref: '#/components/schemas/TaggedItemsLite'
      discriminator:
        propertyName: object_type
        mapping:
          piirule: '#/components/schemas/PiiRule'
          taggeditems: '#/components/schemas/TaggedItemsLite'
    LookMLField:
      type: object
      description: 'Adds support for reading a description from metadata

        that support modifying description'
      properties:
        guid:
          type: string
          maxLength: 25
        name:
          type: string
          description: Fully-qualified name of the field
        label:
          type: string
          description: Fully-qualified human-readable label of the field
        description:
          type: string
          nullable: true
          description: Active description
        description_source:
          allOf:
          - $ref: '#/components/schemas/DescriptionSourceEnum'
          readOnly: true
          nullable: true
        user_description:
          type: string
          readOnly: true
          nullable: true
          description: User description
        user_description_author:
          allOf:
          - $ref: '#/components/schemas/UserLite'
          readOnly: true
        ai_description:
          type: string
          readOnly: true
          nullable: true
          description: AI-generated description
        ingested_description:
          type: string
          readOnly: true
          nullable: true
          description: Unmodified description from the data source
        richtext_description:
          type: string
          nullable: true
          description: Richtext formatted description. Can be in Slatejs or Draftjs format.
        suggested_description:
          type: string
          nullable: true
          description: 'Suggested description coming from lineage, similar table, or public docs.


            When `force_showing_suggested_description` query parameter value is `false`,

            suggested description is returned only if there is no user or ingested description.'
          readOnly: true
        project_name:
          type: string
          nullable: true
          description: The name of the project this field is defined in
        field_type:
          allOf:
          - $ref: '#/components/schemas/LookMLFieldFieldTypeEnum'
          readOnly: true
        type:
          type: string
        external_type:
          type: string
          readOnly: true
          description: The LookML type of the field
        data_type:
          type: string
          description: Map external_type to the Select Star type
          readOnly: true
        view_label:
          type: string
        popularity:
          allOf:
          - $ref: '#/components/schemas/LookerFieldPopularity'
          readOnly: true
        is_used_as_filter:
          readOnly: true
        is_used_as_pivot:
          readOnly: true
        is_metric:
          readOnly: true
        is_mention:
          readOnly: true
        tagged_items:
          type: array
          items:
            $ref: '#/components/schemas/TaggedItemsLiteWithSource'
          readOnly: true
        sql:
          type: string
          readOnly: true
          nullable: true
          description: SQL expression as defined in the LookML model. The SQL syntax shown here is a representation intended for auditability, and is not necessarily an exact match for what will ultimately be run in the database. It may contain special LookML syntax or annotations that are not valid SQL. This will be null if the current user does not have the see_lookml permission for the field's model.
        suggested_description_source:
          allOf:
          - $ref: '#/components/schemas/SuggestedDescriptionSourceEnum'
          readOnly: true
        suggested_description_source_object:
          allOf:
          - $ref: '#/components/schemas/LookMLFieldSerializer.GuidReferenceField.suggested_description_source_object'
          readOnly: true
        view:
          allOf:
          - $ref: '#/components/schemas/LookMLView'
          readOnly: true
        data_types:
          allOf:
          - $ref: '#/components/schemas/BaseType'
          readOnly: true
      required:
      - ai_description
      - data_type
      - data_types
      - description_source
      - external_type
      - field_type
      - ingested_description
      - is_mention
      - is_metric
      - is_used_as_filter
      - is_used_as_pivot
      - label
      - name
      - popularity
      - sql
      - suggested_description
      - suggested_description_source
      - suggested_description_source_object
      - tagged_items
      - type
      - user_description
      - user_description_author
      - view
      - view_label
    LookerFieldPopularity:
      type: object
      properties:
        timeframe:
          type: integer
          readOnly: true
          default: 90
        user_count:
          type: integer
          readOnly: true
        service_query_count:
          type: integer
          readOnly: true
        popularity:
          type: integer
          readOnly: true
          description: Popularity score for this object from 0-100
        query_count:
          type: integer
        view_count:
          type: integer
      required:
      - popularity
      - query_count
      - service_query_count
      - timeframe
      - user_count
      - view_count
    UserLite:
      type: object
      properties:
        guid:
          type: string
          readOnly: true
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
        team:
          allOf:
          - $ref: '#/components/schemas/TeamShortcut'
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
          title: Email address
        avatar:
          type: string
          format: uri
          readOnly: true
          nullable: true
        is_active:
          type: boolean
          readOnly: true
      required:
      - avatar
      - email
      - first_name
      - guid
      - is_active
      - last_name
      - team
    TaggedItemsNoSubTagsSerializer.GuidReferenceField.suggestion_source_object:
      anyOf:
      - $ref: '#/components/schemas/PiiRule'
      - $ref: '#/components/schemas/TaggedItemsLite'
      discriminator:
        propertyName: object_type
        mapping:
          piirule: '#/components/schemas/PiiRule'
          taggeditems: '#/components/schemas/TaggedItemsLite'
    LookMLFieldSerializer.GuidReferenceField.suggested_description_source_object:
      $ref: '#/components/schemas/SuggestedDescriptionSourceObject'
    CollectionLite:
      type: object
      properties:
        guid:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
        icon:
          type: string
          readOnly: true
        data_types:
          allOf:
          - $ref: '#/components/schemas/BaseType'
          readOnly: true
        breadcrumbs:
          type: array
          items:
            $ref: '#/components/schemas/Breadcrumb'
          readOnly: true
        emoji:
          type: string
          readOnly: true
          nullable: true
          description: Unicode representation of the selected emoji
        color_scheme:
          type: string
          readOnly: true
          nullable: true
          description: Color scheme selected by the user for the icon
        linked_from:
          type: array
          items:
            type: string
          readOnly: true
          description: Tags having a link to this collection
      required:
      - breadcrumbs
      - color_scheme
      - data_types
      - emoji
      - guid
      - icon
      - linked_from
      - name
    LookMLViewSerializer.GuidReferenceField.technical_owner:
      anyOf:
      - $ref: '#/components/schemas/DSUserName'
      - $ref: '#/components/schemas/Team'
      - $ref: '#/components/schemas/UserLite'
      discriminator:
        propertyName: object_type
        mapping:
          dsuser: '#/components/schemas/DSUserName'
          team: '#/components/schemas/Team'
          user: '#/components/schemas/UserLite'
    DSUserName:
      type: object
      properties:
        guid:
          type: string
          maxLength: 25
        display_name:
          type: string
          nullable: true
          description: The username field for the user used by the datasource
          maxLength: 100
        name:
          type: string
          maxLength: 100
        data_source:
          $ref: '#/components/schemas/DataSourceInfo'
      required:
      - data_source
      - name
    TaggedItemsNoSubTagsSerializer.GuidReferenceField.item:
      $ref: '#/components/schemas/TaggedItemsObject'
    TaggedItemsObject:
      type: object
      description: 'Adds support for reading a description from metadata

        that support modifying description'
      properties:
        suggested_description:
          type: string
          nullable: true
          description: 'Suggested description coming from lineage, similar table, or public docs.


            When `force_showing_suggested_description` query parameter value is `false`,

            suggested description is returned only if there is no user or ingested description.'
          readOnly: true
        suggested_description_source:
          type: string
          nullable: true
          readOnly: true
        suggested_description_source_object:
          allOf:
          - $ref: '#/components/schemas/SuggestedDescriptionSourceObject'
          readOnly: true
        data_types:
          allOf:
          - $ref: '#/components/schemas/BaseType'
          readOnly: true
        object_type:
          type: string
          readOnly: true
        guid:
          type: string
          readOnly: true
        name:
          type: string
          nullable: true
          readOnly: true
        short_name:
          type: string
          readOnly: true
        description:
          type: string
          default: ''
        description_source:
          allOf:
          - $ref: '#/components/schemas/DescriptionSourceEnum'
          description: 'The source of the active description.


            * `user` - User

            * `ingestion` - Ingestion

            * `ai` - Ai

            * `public_docs` - Public Docs

            * `lineage` - Lineage

            * `downstream_lineage` - Downstream Lineage

            * `upstream_lineage` - Upstream Lineage

            * `similarity` - Similarity

            * `unknown` - Unknown'
        user_description:
          type: string
          readOnly: true
        user_description_author:
          allOf:
          - $ref: '#/components/schemas/UserLite'
          readOnly: true
        ingested_description:
          type: string
          readOnly: true
        ai_description:
          type: string
          readOnly: true
        search_name:
          type: string
          readOnly: true
          default: ''
        data_type:
          type: string
          readOnly: true
          default: ''
        external_type:
          type: string
          readOnly: true
          default: ''
        data_source:
          allOf:
          - $ref: '#/components/schemas/BaseDataSource'
          readOnly: true
        data_source_type:
          type: string
          nullable: true
          readOnly: true
          default: ''
        url:
          type: string
          format: uri
          readOnly: true
        parent_guid:
          type: string
          readOnly: true
        last_updated_on:
          type: string
          format: date-time
          readOnly: true
        is_hidden:
          type: boolean
          readOnly: true
        breadcrumbs:
          type: array
          items:
            $ref: '#/components/schemas/Breadcrumb'
          readOnly: true
        richtext_description:
          type: string
          default: ''
          description: Rich text version of `description` using SlateJS or Markdown format.
        popularity:
          type: object
          additionalProperties: {}
          nullable: true
          readOnly: true
        raw_popularity:
          type: integer
          nullable: true
          readOnly: true
        downstream_objects_counts:
          allOf:
          - $ref: '#/components/schemas/RelatedObjectsCounts'
          readOnly: true
        upstream_objects_counts:
          allOf:
          - $ref: '#/components/schemas/RelatedObjectsCounts'
          readOnly: true
        tagged_items:
          type: array
          items:
            $ref: '#/components/schemas/TaggedItemsLiteWithSource'
          readOnly: true
        deactivation_scheduled_on:
          type: string
          format: date-time
          nullable: true
          description: 'A time when objects is fully deactivated, so deactivate grace period pass too


            That implementation gracefully supports models which does not support deactivation.

            Alternative implementation in `data_sources.serializers.base.DeactivationScheduledOnMixin`

            enforces deactivation support.'
          readOnly: true
        field:
          allOf:
          - $ref: '#/components/schemas/LookMLField'
          readOnly: true
          nullable: true
        label:
          type: string
          readOnly: true
          nullable: true
        emoji:
          type: string
          readOnly: true
          nullable: true
        color_scheme:
          type: string
          readOnly: true
          nullable: true
      required:
      - ai_description
