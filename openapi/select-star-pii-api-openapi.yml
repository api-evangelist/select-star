      - color_scheme
      - data_source
      - data_source_type
      - data_type
      - data_types
      - deactivation_scheduled_on
      - downstream_objects_counts
      - emoji
      - external_type
      - field
      - guid
      - ingested_description
      - is_hidden
      - label
      - last_updated_on
      - name
      - object_type
      - parent_guid
      - popularity
      - raw_popularity
      - search_name
      - short_name
      - suggested_description
      - suggested_description_source
      - suggested_description_source_object
      - tagged_items
      - upstream_objects_counts
      - url
      - user_description
      - user_description_author
    TaggedItemsLiteSerializer.GuidReferenceField.item:
      $ref: '#/components/schemas/BaseMetadata'
    LookerViewPopularity:
      type: object
      properties:
        timeframe:
          type: integer
          readOnly: true
          default: 90
        user_count:
          type: integer
          readOnly: true
        service_query_count:
          type: integer
          readOnly: true
        popularity:
          type: integer
          readOnly: true
          description: Popularity score for this object from 0-100
        query_count:
          type: integer
      required:
      - popularity
      - query_count
      - service_query_count
      - timeframe
      - user_count
    PiiRule:
      type: object
      properties:
        guid:
          type: string
          maxLength: 25
        name:
          type: string
          description: PII Rule name display name
          maxLength: 50
        type:
          allOf:
          - $ref: '#/components/schemas/PIIType'
          description: 'The type of PII this represents


            * `address` - address

            * `banking` - banking

            * `birthdate` - birthdate

            * `document` - document

            * `email` - email

            * `face_photo` - face_photo

            * `gender` - gender

            * `marital_status` - marital_status

            * `nationality` - nationality

            * `online_account` - online_account

            * `online_address` - online_address

            * `password` - password

            * `person` - person

            * `phone` - phone

            * `salary` - salary

            * `ssn` - ssn

            * `username` - username'
        regex:
          type: string
          description: The PII Rule
        created_by:
          allOf:
          - $ref: '#/components/schemas/UserLite'
          readOnly: true
        active:
          type: boolean
        item_count:
          type: integer
          readOnly: true
      required:
      - created_by
