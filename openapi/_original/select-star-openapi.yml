openapi: 3.0.3
info:
  title: Select Star Metadata API
  version: 1.0.0
  x-role-system:
    description: This API uses role-based access control
    roles:
      admin: Full access to all operations
      data_manager: Can modify data and configurations
      user: Read-only access to most resources
  description: API for interacting with the Select Star system
  termsOfService: https://www.selectstar.com/terms-of-service
  contact:
    email: support@selectstar.com
  license:
    name: All Rights Reserved
paths:
  /scim/v2/Me:
    get:
      operationId: scim_v2_Me_retrieve
      description: |-
        Manage Users with a SCIM compliant API.

        **Required Role:** Admin
      tags:
      - scim
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/SCIMUser'
          description: ''
      x-role-requirements: Admin
    put:
      operationId: scim_v2_Me_update
      description: |-
        Manage Users with a SCIM compliant API.

        **Required Role:** Admin
      tags:
      - scim
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SCIMUserUpdateRequest'
        required: true
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/SCIMUser'
          description: ''
      x-role-requirements: Admin
  /scim/v2/ResourceTypes:
    get:
      operationId: scim_v2_ResourceTypes_retrieve
      tags:
      - scim
      security:
      - tokenAuth: []
      responses:
        '200':
          description: No response body
      description: '**Required Role:** Authenticated User with Active Organization'
      x-role-requirements: Authenticated User with Active Organization
  /scim/v2/ServiceProviderConfig:
    get:
      operationId: scim_v2_ServiceProviderConfig_retrieve
      tags:
      - scim
      security:
      - tokenAuth: []
      responses:
        '200':
          description: No response body
      description: '**Required Role:** Authenticated User with Active Organization'
      x-role-requirements: Authenticated User with Active Organization
  /scim/v2/Users:
    get:
      operationId: scim_v2_Users_list
      description: |-
        Manage Users with a SCIM compliant API.

        **Required Role:** Admin
      parameters:
      - in: query
        name: count
        schema:
          type: integer
        description: Non-negative integer. Specifies the desired maximum number of
          query results per page, e.g., 10. A negative value SHALL be interpreted
          as "0". A value of "0" indicates that no resource results are to be returned
          except for "totalResults".
      - in: query
        name: page
        schema:
          type: integer
        description: Deprecated. Use startIndex instead.
      - in: query
        name: page_size
        schema:
          type: integer
        description: Deprecated. Use count instead.
      - in: query
        name: startIndex
        schema:
          type: integer
        description: The 1-based index of the first query result.
      - in: query
        name: userName
        schema:
          type: string
        description: A string that is matched against the "userName" or "email" attributes
          of a User.
      tags:
      - scim
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/SCIMUserListResponse'
          description: ''
      x-role-requirements: Admin
    post:
      operationId: scim_v2_Users_create
      description: |-
        Manage Users with a SCIM compliant API.

        **Required Role:** Admin
      tags:
      - scim
      requestBody:
        content:
          application/scim+json:
            schema:
              $ref: '#/components/schemas/SCIMUserCreateRequest'
        required: true
      security:
      - tokenAuth: []
      responses:
        '201':
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/SCIMUser'
          description: ''
      x-role-requirements: Admin
  /scim/v2/Users/{guid}:
    get:
      operationId: scim_v2_Users_retrieve
      description: |-
        Manage Users with a SCIM compliant API.

        **Required Role:** Admin
      parameters:
      - in: path
        name: guid
        schema:
          type: string
          pattern: ^([a-zA-z]{2}_[a-zA-Z0-9]{22})|me|default|([a-zA-z]{2}_[a-zA-Z0-9]{22}).personal$
        required: true
      tags:
      - scim
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/SCIMUser'
          description: ''
      x-role-requirements: Admin
    put:
      operationId: scim_v2_Users_update
      description: |-
        Manage Users with a SCIM compliant API.

        **Required Role:** Admin
      parameters:
      - in: path
        name: guid
        schema:
          type: string
          pattern: ^([a-zA-z]{2}_[a-zA-Z0-9]{22})|me|default|([a-zA-z]{2}_[a-zA-Z0-9]{22}).personal$
        required: true
      tags:
      - scim
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SCIMUserUpdateRequest'
        required: true
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/SCIMUser'
          description: ''
      x-role-requirements: Admin
    delete:
      operationId: scim_v2_Users_destroy
      description: |-
        Manage Users with a SCIM compliant API.

        **Required Role:** Admin
      parameters:
      - in: path
        name: guid
        schema:
          type: string
          pattern: ^([a-zA-z]{2}_[a-zA-Z0-9]{22})|me|default|([a-zA-z]{2}_[a-zA-Z0-9]{22}).personal$
        required: true
      tags:
      - scim
      security:
      - tokenAuth: []
      responses:
        '204':
          description: No response body
      x-role-requirements: Admin
  /v1/bi/dashboards/:
    get:
      operationId: bi_dashboards_list
      description: |-
        List of all dashboards available in authenticated user's organization

        **Required Role:** Viewer or higher
      parameters:
      - name: bifolders
        required: false
        in: query
        description: A comma separated list of BI folder guids to filter for dashboards
          within those folders.
        schema:
          type: string
          pattern: ^(fl)_(?P<guid>[23456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz]{22})$
      - name: collections
        required: false
        in: query
        description: A comma separated list of collection guids, for to filter the
          collection items from
        schema:
          type: string
          pattern: ^(cn)_(?P<guid>[23456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz]{22})$
      - name: data_type
        required: false
        in: query
        description: A value to filter by dashboard type.
        schema:
          type: string
          enum:
          - ThoughtspotTypes.ANSWER
          - content_crma
          - content_lightning
          - dashboard
          - dashboard_crma
          - dashboard_lightning
          - dashboards
          - data_studio_dashboards
          - ThoughtspotTypes.LIVEBOARD
          - looks
          - periscope_dashboards
          - power_bi_dashboards
          - power_bi_elements
          - power_bi_reports
          - report
          - report_crma
          - report_lightning
          - reports
          - s3_object
          - sigma_dashboards
          - workbooks
      - name: datasources
        required: false
        in: query
        description: A comma separated list of data source guids to filter for items
          within those data sources.
        schema:
          type: string
          pattern: ^(ds)_(?P<guid>[23456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz]{22})$
      - name: dsuser_created_by
        required: false
        in: query
        description: A comma separated list of Data Source Users guids to filter for
          element creator. Allowed Values include DSUser GUIDs + 'known_users' + 'unknown_users'
        schema:
          type: string
      - name: dsuser_owned_by
        required: false
        in: query
        description: A comma separated list of Data Source Users guids to filter for
          element owner (permission). Allowed Values include DSUser GUIDs + 'known_users'
          + 'unknown_users'
        schema:
          type: string
      - name: is_hidden
        required: false
        in: query
        description: A boolean to show hidden objects when true and hide hidden objects
          when false. Defaults to False.
        schema:
          type: string
      - name: new
        required: false
        in: query
        description: A boolean which filters for newest tables in the organization.
        schema:
          type: string
      - name: no_business_owner
        required: false
        in: query
        description: A flag that filters out any table that has a business owner.
        schema:
          type: string
      - name: no_description
        required: false
        in: query
        description: A flag that filters out any tables with descriptions
        schema:
          type: string
      - name: no_popularity
        required: false
        in: query
        description: A flag that filters out any table that has a popularity rating.
        schema:
          type: string
      - name: no_source_tables
        required: false
        in: query
        description: A flag that shows only assets with no source tables. Only for
          BI Tools
        schema:
          type: string
      - name: no_tags
        required: false
        in: query
        description: A flag that filters out any tagged tables
        schema:
          type: string
      - name: no_technical_owner
        required: false
        in: query
        description: A flag that filters out any table that has a technical owner.
        schema:
          type: string
      - name: order
        required: false
        in: query
        description: "Specify the ordering for the results. \n\n A comma separated\
          \ list for ordering by multiple fields and a preceding `-` indicates reverse\
          \ order. \n\nNote: Order is case-sensitive."
        schema:
          type: string
          enum:
          - bifolder
          - collection
          - created_on
          - dashboard_created_at
          - dashboard_updated_at
          - description
          - dsuser_created_by
          - dsuser_owned_by
          - last_run_at
          - last_successful_run
          - name
          - popularity
          - source_tables_count
          - view_count
      - name: owners
        required: false
        in: query
        description: A comma separated list of user or team guids to filter for objects
          within these users as owners (technical or business).
        schema:
          type: string
          pattern: ^(us|te)_(?P<guid>[23456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz]{22})$
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: popularity
        required: false
        in: query
        description: A comma separated list of popularity ranges (inclusive) can include
          integers from 1-100 ex) 1-10,90-100 would be the bottom 10 percent and the
          top 10 percent, respectively. Ranges can overlap.
        schema:
          type: string
      - name: search_bifolder
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - name: search_business_owner
        required: false
        in: query
        description: Search for an asset using business owner name
        schema:
          type: string
      - name: search_collections
        required: false
        in: query
        description: Search for an asset using a collection name
        schema:
          type: string
      - name: search_description
        required: false
        in: query
        description: Search for an asset using its description
        schema:
          type: string
      - name: search_dsuser_created_by
        required: false
        in: query
        description: Search for an asset using the name of the creator's user
        schema:
          type: string
      - name: search_dsuser_owned_by
        required: false
        in: query
        description: Search for an asset using the name of the owner's user
        schema:
          type: string
      - name: search_name
        required: false
        in: query
        description: Search for an asset using its name
        schema:
          type: string
      - name: search_sql
        required: false
        in: query
        description: Search for an asset using its raw SQL
        schema:
          type: string
      - name: search_tag_name
        required: false
        in: query
        description: Search for an asset using a tag name
        schema:
          type: string
      - name: search_technical_owner
        required: false
        in: query
        description: Search for an asset using technical owner name
        schema:
          type: string
      - name: status_tags
        required: false
        in: query
        description: A comma separated list of tag guids
        schema:
          type: string
          pattern: ^(tg)_(?P<guid>[23456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz]{22})$
      - name: teams
        required: false
        in: query
        description: A comma separated list of team guids to filter for tables owned
          by users of those teams.
        schema:
          type: string
          pattern: ^(te)_(?P<guid>[23456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz]{22})$
      - name: user
        required: false
        in: query
        description: A user guid to filter for dashboards created by that user's Data
          Source users.
        schema:
          type: string
      - name: was_last_run_not_successful
        required: false
        in: query
        description: A boolean to filter for dashboards which were not successfully
          run
        schema:
          type: string
      tags:
      - bi
      security:
      - JWTAuthentication: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDashboardList'
          description: ''
      x-role-requirements: Viewer or higher
  /v1/bi/dashboards/{dashboard__guid}/elements/:
    get:
      operationId: bi_dashboards_elements_list
      description: |-
        List all Dashboard Elements within a specified Dashboard available
        in authenticated user's Organization

        **Required Role:** Viewer or higher
      parameters:
      - in: path
        name: dashboard__guid
        schema:
          type: string
          pattern: ^([a-zA-z]{2}_[a-zA-Z0-9]{22})|me|default|([a-zA-z]{2}_[a-zA-Z0-9]{22}).personal$
        required: true
      - name: order
        required: false
        in: query
        description: "Specify the ordering for the results. \n\n A comma separated\
          \ list for ordering by multiple fields and a preceding `-` indicates reverse\
          \ order. \n\nNote: Order is case-sensitive."
        schema:
          type: string
          enum:
          - description
          - external_type
          - name
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search_description
        required: false
        in: query
        description: Search for an asset using its description
        schema:
          type: string
      - name: search_name
        required: false
        in: query
        description: Search for an asset using its name
        schema:
          type: string
      tags:
      - bi
      security:
      - JWTAuthentication: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDashboardElementList'
          description: ''
      x-role-requirements: Viewer or higher
  /v1/bi/dashboards/{guid}/:
    get:
      operationId: bi_dashboards_retrieve
      description: |-
        Retrieve a single dashboard

        **Required Role:** Viewer or higher
      parameters:
      - in: path
        name: guid
        schema:
          type: string
          pattern: ^([a-zA-z]{2}_[a-zA-Z0-9]{22})|me|default|([a-zA-z]{2}_[a-zA-Z0-9]{22}).personal$
        required: true
      tags:
      - bi
      security:
      - JWTAuthentication: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
          description: ''
      x-role-requirements: Viewer or higher
  /v1/bi/dashboards/{guid}/frequent-dsusers/:
    get:
      operationId: bi_dashboards_frequent_dsusers_retrieve
      description: |-
        Get the most frequent BI users and associated Select Star users (if any) that query a specified Dashboard

        **Required Role:** Authenticated User with Active Organization
      parameters:
      - in: path
        name: guid
        schema:
          type: string
          pattern: ^([a-zA-z]{2}_[a-zA-Z0-9]{22})|me|default|([a-zA-z]{2}_[a-zA-Z0-9]{22}).personal$
        required: true
      tags:
      - bi
      security:
      - JWTAuthentication: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FrequentDSUser'
          description: ''
      x-role-requirements: Authenticated User with Active Organization
  /v1/bi/dashboards/frequent-dsusers/:
    get:
      operationId: bi_dashboards_frequent_dsusers_list
      description: |-
        Get the most frequent BI users and associated Select Star users (if any) that query a list of Dashboards

        **Required Role:** Authenticated User with Active Organization
      parameters:
      - name: datasources
        required: false
        in: query
        description: A comma separated list of data source guids to filter for items
          within those data sources.
        schema:
          type: string
          pattern: ^(ds)_(?P<guid>[23456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz]{22})$
      - name: only_registered_users
        required: false
        in: query
        description: A flag to hide DSUsers with no association with registered application
          users
        schema:
          type: string
      - name: order
        required: false
        in: query
        description: "Specify the ordering for the results. \n\n A comma separated\
          \ list for ordering by multiple fields and a preceding `-` indicates reverse\
          \ order. \n\nNote: Order is case-sensitive."
        schema:
          type: string
          enum:
          - last_queried
          - name
          - query_count
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: require_email
        required: false
        in: query
        description: A flag to hide DSUsers with no associated registered user nor
          email
        schema:
          type: string
      - name: search_name
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - name: type
        required: false
        in: query
        description: A comma separated list of data source types to filter for dsusers
          within that type
        schema:
          type: string
      tags:
      - bi
      security:
      - JWTAuthentication: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFrequentDSUserList'
          description: ''
      x-role-requirements: Authenticated User with Active Organization
  /v1/bi/dashboards/owners/:
    patch:
      operationId: bi_dashboards_owners_partial_update
      description: |-
        Manage BI Dashboards

        **Required Role:** Data Manager or higher
      tags:
      - bi
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedDashboardOwnersBulkEditRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedDashboardOwnersBulkEditRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedDashboardOwnersBulkEditRequest'
      security:
      - JWTAuthentication: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardOwnersBulkEdit'
          description: ''
      x-role-requirements: Data Manager or higher
  /v1/bi/data-sources/:
    get:
      operationId: bi_data_sources_list
      description: |-
        List all Published Data Sources within in authenticated user's Organization

        **Required Role:** Viewer or higher
      parameters:
      - name: bifolders
        required: false
        in: query
        description: A comma separated list of BI folder guids to filter for dashboards
          within those folders.
        schema:
          type: string
          pattern: ^(fl)_(?P<guid>[23456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz]{22})$
      - name: collections
        required: false
        in: query
        description: A comma separated list of collection guids, for to filter the
          collection items from
        schema:
          type: string
          pattern: ^(cn)_(?P<guid>[23456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz]{22})$
      - name: datasources
        required: false
        in: query
        description: A comma separated list of data source guids to filter for items
          within those data sources.
        schema:
          type: string
          pattern: ^(ds)_(?P<guid>[23456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz]{22})$
      - name: dsuser_created_by
        required: false
        in: query
        description: A comma separated list of Data Source Users guids to filter for
          element creator. Allowed Values include DSUser GUIDs + 'known_users' + 'unknown_users'
        schema:
          type: string
      - name: is_hidden
        required: false
        in: query
        description: A boolean to show hidden objects when true and hide hidden objects
          when false. Defaults to False.
        schema:
          type: string
      - name: new
        required: false
        in: query
        description: A boolean which filters for newest tables in the organization.
        schema:
          type: string
      - name: no_description
        required: false
        in: query
        description: A flag that filters out any tables with descriptions
        schema:
          type: string
      - name: no_downstream_lineage
        required: false
        in: query
        description: A flag that shows only tables with no downstream lineage
        schema:
          type: string
      - name: no_popularity
        required: false
        in: query
        description: A flag that filters out any table that has a popularity rating.
        schema:
          type: string
      - name: no_source_tables
        required: false
        in: query
        description: A flag that shows only assets with no source tables. Only for
          BI Tools
        schema:
          type: string
      - name: no_tags
        required: false
        in: query
        description: A flag that filters out any tagged tables
        schema:
          type: string
      - name: order
        required: false
        in: query
        description: "Specify the ordering for the results. \n\n A comma separated\
          \ list for ordering by multiple fields and a preceding `-` indicates reverse\
          \ order. \n\nNote: Order is case-sensitive."
        schema:
          type: string
          enum:
          - collection
          - connection_method
          - connection_type
          - created_at
          - description
          - downstream_objects_total
          - dsuser_created_by
          - impact_score
          - name
          - popularity
          - source_tables_count
          - updated_at
          - upstream_objects_total
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: popularity
        required: false
        in: query
        description: A comma separated list of popularity ranges (inclusive) can include
          integers from 1-100 ex) 1-10,90-100 would be the bottom 10 percent and the
          top 10 percent, respectively. Ranges can overlap.
        schema:
          type: string
      - name: search_collections
        required: false
        in: query
        description: Search for an asset using a collection name
        schema:
          type: string
      - name: search_description
        required: false
        in: query
        description: Search for an asset using its description
        schema:
          type: string
      - name: search_dsuser_created_by
        required: false
        in: query
        description: Search for an asset using the name of the creator's user
        schema:
          type: string
      - name: search_name
        required: false
        in: query
        description: Search for an asset using its name
        schema:
          type: string
      - name: search_tag_name
        required: false
        in: query
        description: Search for an asset using a tag name
        schema:
          type: string
      - name: status_tags
        required: false
        in: query
        description: A comma separated list of tag guids
        schema:
          type: string
          pattern: ^(tg)_(?P<guid>[23456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz]{22})$
      - name: types
        required: false
        in: query
        description: A comma separated list of tableau data source types
