    CSVResponse:
      type: object
      description: |-
        Serializer for CSV upload response.

        This serializer is used to serialize the response data after a CSV file has been uploaded and processed.
        It includes two fields:

        - `created`: An integer field that represents the number of new records created during the upload process.
        - `updated`: An integer field that represents the number of existing records that were updated during the upload process.

        The serializer is designed to be used with a view that handles the CSV file upload and processing, and returns a response containing the number of created and updated records.

        Usage:
            - CSVUploadMixin.
