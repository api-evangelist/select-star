    OrganizationSettings:
      type: object
      properties:
        allow_email_password_authentication:
          type: boolean
          readOnly: true
          title: Allow email/password authentication
          description: When disabled, users will be forced to use "Sign in with Google"
            or WorkOS SSO
        automated_pii:
          type: boolean
          readOnly: true
          description: A feature flag to enable Automated PII Detection (Beta)
        enable_cost_analysis:
          type: boolean
          readOnly: true
          description: A feature flag to enable access to cost analysis. Each data
            source's ingestion configuration changes may be required to ensure data
            ingestion for cost analysis.In order to turn the cost analysis on, use
            Enable Cost Analysis command. For detailed information, about this specific
            flag reach out to Engineering.
        enable_max_level_in_lineage_tags:
          type: boolean
          readOnly: true
          description: A feature flag to decide whether limit the number of levels
            in lineage tags
        popularity_timeframe:
          type: integer
          readOnly: true
          nullable: true
          description: Use a number between 30-90 indicating the number of days to
            calculate popularity. If this is null, it uses the default setting of
            starting with 30 days and then automatically increasing up to 90 days.
        separate_schemata:
          type: boolean
          readOnly: true
          description: Check if the schemata should show separated from the tables.
            When it's false, table names display as schema_name.table_name.
        show_previews:
          type: boolean
          readOnly: true
        show_schemata_page:
          type: boolean
          readOnly: true
          description: Check for showing the schemata page when clicked on menu sidebar
        show_sidebar_search:
          type: boolean
          readOnly: true
          description: Check for showing/removing the sidebar search. This is per
            organization
        use_ai_customization_settings:
          type: boolean
          readOnly: true
          description: A feature flag to enable AI Customization Settings
        use_ai_customization_settings_data_access:
          type: boolean
          readOnly: true
          description: A feature flag to enable AI Customization Settings data access
        use_ai_descriptions:
          type: boolean
          readOnly: true
        use_avatar_initials:
          allOf:
          - $ref: '#/components/schemas/UseAvatarInitialsEnum'
          readOnly: true
          description: |-
            Enables the alternative avatar initials generation. This comes from a need for Korean customers

            * `english` - english
            * `korean` - korean
        use_client_api:
          type: boolean
          readOnly: true
          description: Enables Client API
        use_cortex_analyst:
          type: boolean
          readOnly: true
          description: Enables the Snowflake Cortex Analyst feature
        use_custom_attributes_search:
          type: boolean
          readOnly: true
          title: Enable searching on custom attributes
          description: A feature flag to enable searching for objects using their
            custom attributes text.
        use_data_quality_tab:
          type: boolean
          readOnly: true
          description: Enables the Data Quality tab
        use_data_quality_upstream_issues:
          type: boolean
          readOnly: true
          description: Enables the Data Quality Upstream Issues tab
        use_discussions:
          type: boolean
          readOnly: true
          description: Enables discussion feature for this organization
        use_downstream_notifications:
          type: boolean
          readOnly: true
          title: Enable Downstream Notifications
          description: A feature flag to enable downstream notifications from comments
        use_fivetran:
          type: boolean
          readOnly: true
          description: Enables the Fivetran Integration.
        use_db_agent:
          type: boolean
          readOnly: true
          description: Enables access to the DB Agent integration
        use_group_label:
          type: boolean
          readOnly: true
          description: Looker - Use group_label instead of model label
        use_impact_score:
          type: boolean
          readOnly: true
          description: Enables the Impact Score feature, including calculation
        use_incidents_ingestion_for_monte_carlo:
          type: boolean
          readOnly: true
          description: Enables the Incidents ingestion for Monte Carlo integration.
            When turned off incidents information is gather on the fly during our
            requests.
        use_llm_chatbot:
          type: boolean
          readOnly: true
        use_metric_generation:
          type: boolean
          readOnly: true
        use_new_layout:
          type: boolean
          readOnly: true
          description: Enables the new layout
        use_new_mentions:
          type: boolean
          readOnly: true
          title: Enable New Mentions approach
          description: A feature flag to enable New Mentions per org
        use_rbac:
          type: boolean
          readOnly: true
          description: Enables RBAC with full enforcement. If the flag is turned on,
            it overrides whatever is set in use_rbac_data_propagation In order to
            turn the RBAC on, use Enable RBAC command. For detailed information, about
            this specific flag reach out to Engineering.
        use_rbac_in_lineage:
          type: boolean
          readOnly: true
          description: Enables RBAC in Lineage for customers using PBAC. This flag
            is used to enable RBAC specifically for the Lineage feature. The flag
            is ignored when use_rbac flag is turned off.
        use_relevant_lineage:
          type: boolean
          readOnly: true
          description: Enables relevant lineage
        use_schema_change_detection:
          type: boolean
          readOnly: true
          description: A feature flag to enable schema change detection
        use_schema_change_notification:
          type: boolean
          readOnly: true
          description: Enables the schema change notification feature
        use_serial_tables_detection:
          type: boolean
          readOnly: true
          description: Enables the serial tables detection during QL ingestion. This
            process set the `serial_table_frequency` column in the Table.
        use_show_more_button:
          type: boolean
