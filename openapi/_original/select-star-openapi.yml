        use_user_lists:
          type: boolean
          readOnly: true
          title: Enable User Lists
          description: A feature flag to enable User Lists
        enable_ai_features:
          type: boolean
          readOnly: true
          description: Enable AI features
        use_natural_language_search:
          type: boolean
          readOnly: true
        use_salesforce_crma:
          type: boolean
          readOnly: true
          description: Enables the Salesforce CRMA Integration.
        use_omni:
          type: boolean
          readOnly: true
