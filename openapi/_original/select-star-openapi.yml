components:
  schemas:
    ActivityAnalytics:
      type: object
      properties:
        target:
          type: string
          readOnly: true
        target_name:
          type: string
          readOnly: true
        target_object_type:
          type: string
          readOnly: true
        target_data_type:
          type: string
          readOnly: true
        target_parent_guid:
          type: string
          readOnly: true
        performed_on:
          type: string
          format: date-time
          readOnly: true
        activity_type:
          type: string
          readOnly: true
        user:
          $ref: '#/components/schemas/UserActivityAnalytics'
        data_types:
          allOf:
          - $ref: '#/components/schemas/BaseType'
          readOnly: true
        field:
          type: string
          readOnly: true
          nullable: true
          description: The field of the class the activity pertains to. Can be null
            in instances such as view
        message:
          allOf:
          - $ref: '#/components/schemas/ActivityMessage'
          readOnly: true
        data:
          type: string
          readOnly: true
          nullable: true
          description: Extra data stored for the activity (e.g. pre- or post-update
            field value)
      required:
      - activity_type
      - data
      - data_types
      - field
      - message
      - performed_on
      - target
      - target_data_type
      - target_name
      - target_object_type
      - target_parent_guid
      - user
    ActivityMessage:
      type: object
      description: |-
        Activity Message Serializer is written to handle the
        different types of messages that possible for activity
        to display.
        For this serializer to work, context must be passed in
        with the key.
        target_data_source.type.value
      properties:
        template:
          type: string
        values:
          $ref: '#/components/schemas/ActivityMessageValue'
      required:
      - template
      - values
    ActivityMessageData:
      type: object
      properties:
        object_type:
          type: string
          nullable: true
        data:
          type: object
          oneOf:
          - type: object
            properties:
              first_name:
                type: string
              last_name:
                type: string
              guid:
                type: string
              avatar:
                type: string
                nullable: true
          - type: object
            properties:
              guid:
                type: string
              name:
                type: string
              data_types:
                type: object
              parent_guid:
                type: string
                nullable: true
          - type: object
            properties:
              guid:
                type: string
              name:
                type: string
              data_types:
                type: object
          readOnly: true
          nullable: true
      required:
      - data
      - object_type
    ActivityMessageValue:
      type: object
      properties:
        user:
          allOf:
          - $ref: '#/components/schemas/ActivityMessageData'
          nullable: true
        target:
          allOf:
          - $ref: '#/components/schemas/ActivityMessageData'
          nullable: true
        parent:
          allOf:
          - $ref: '#/components/schemas/ActivityMessageData'
          nullable: true
    ActivitySchemaChanges:
      type: object
      properties:
        guid:
          type: string
          readOnly: true
        target:
          type: string
          readOnly: true
        target_name:
          type: string
        target_parent_guid:
          type: string
        target_data_source:
          $ref: '#/components/schemas/BaseDataSource'
        performed_on:
          type: string
          format: date-time
          readOnly: true
        breadcrumbs:
          type: array
          items:
            $ref: '#/components/schemas/Breadcrumb'
        message:
          allOf:
          - $ref: '#/components/schemas/ActivityMessage'
          readOnly: true
        data:
          type: string
          readOnly: true
          nullable: true
          description: Extra data stored for the activity (e.g. pre- or post-update
            field value)
        data_types:
          allOf:
          - $ref: '#/components/schemas/BaseType'
          readOnly: true
      required:
      - breadcrumbs
      - data
      - data_types
      - guid
      - message
      - performed_on
      - target
      - target_data_source
      - target_name
      - target_parent_guid
    BIConnectionLite:
      type: object
      description: |-
        Adds support for reading a description from metadata
        that support modifying description
      properties:
        guid:
          type: string
          maxLength: 25
        external_id:
          type: string
          description: External unique identifier of this resource
        name:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
          description: User description
        data_source_created_at:
          type: string
          format: date-time
          nullable: true
          description: The creation date ingested from API
        data_source_updated_at:
          type: string
          format: date-time
          nullable: true
          description: The updation date ingested from API
        connection_type:
          type: string
          nullable: true
          description: 'tableau: the kind of connection that is providing data'
      required:
      - external_id
