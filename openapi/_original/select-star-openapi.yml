    PatchedCollectionItemBulkUpdateRequest:
      type: object
      properties:
        collection_set:
          type: array
          items:
            $ref: '#/components/schemas/CollectionSetRequest'
          writeOnly: true
          description: A list of collections and items to be added to or removed from.
        replace_existing:
          type: boolean
          writeOnly: true
          default: false
          description: Replace all items in a collection with the given request. Only
            items the user has access to will be added and removed.
        remove_only:
          type: boolean
          writeOnly: true
          default: false
          description: Only remove items from the specified collections. No additions
            will be made.
        ignore_conflicts:
          type: boolean
          writeOnly: true
          default: false
          description: Silently ignore conflicts when adding items that already exist
            in collections. If False, will raise validation errors for duplicates.
    PatchedCollectionOwnersBulkEditRequest:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ListSerializer.GuidReferenceField.Request'
        business_owner:
          allOf:
          - $ref: '#/components/schemas/CollectionOwnersBulkEditSerializer.GuidReferenceField.business_ownerRequest'
          nullable: true
        technical_owner:
          allOf:
          - $ref: '#/components/schemas/CollectionOwnersBulkEditSerializer.GuidReferenceField.technical_ownerRequest'
          nullable: true
    PatchedColumnRequest:
      type: object
      description: |-
        Adds support for reading a description from metadata
        that support modifying description
      properties:
        table:
          $ref: '#/components/schemas/TableInfoRequest'
        is_primary_key:
          type: boolean
          description: Whether this column is part of table's primary key
        field_type:
          type: string
          minLength: 1
        richtext_description:
          type: string
          nullable: true
