        required: false
        in: query
        description: Calculate and include total object counts in the response.
        schema:
          type: boolean
          default: true
      - name: is_join_key
        required: false
        in: query
        description: Filters by is_join_key field value.
        schema:
          type: string
      - name: new
        required: false
        in: query
        description: A boolean which filters for newest tables in the organization.
        schema:
          type: string
      - name: no_description
        required: false
        in: query
        description: A flag that filters out any tables with descriptions
        schema:
          type: string
      - name: no_downstream_lineage
        required: false
        in: query
        description: A flag that shows only tables with no downstream lineage
        schema:
          type: string
      - name: no_popularity
        required: false
        in: query
        description: A flag that filters out any table that has a popularity rating.
        schema:
          type: string
      - name: no_tags
        required: false
        in: query
        description: A flag that filters out any tagged tables
        schema:
          type: string
      - name: no_upstream_lineage
        required: false
        in: query
        description: A flag that shows only tables with no upstream lineage
        schema:
          type: string
      - name: order
        required: false
        in: query
        description: "Specify the ordering for the results. \n\n A comma separated\
          \ list for ordering by multiple fields and a preceding `-` indicates reverse\
          \ order. \n\nNote: Order is case-sensitive."
        schema:
          type: string
          enum:
          - api_name
          - description
          - downstream_charts
          - downstream_objects_total
          - external_type
          - formula
          - impact_score
          - label
          - name
          - popularity
          - salesforce_data_type
          - upstream_objects_total
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: popularity
        required: false
        in: query
        description: A comma separated list of popularity ranges (inclusive) can include
          integers from 1-100 ex) 1-10,90-100 would be the bottom 10 percent and the
          top 10 percent, respectively. Ranges can overlap.
        schema:
          type: string
      - name: schemas
        required: false
        in: query
        description: A comma separated list of schema guids to filter for columns
          within those schemas
        schema:
          type: string
          pattern: ^(cl)_(?P<guid>[23456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz]{22})$
      - name: search_all
        required: false
        in: query
        description: Search a column with multiple types of params in one go
        schema:
          type: string
      - name: search_description
        required: false
        in: query
        description: Search for an asset using its description
        schema:
          type: string
      - name: search_external_type
        required: false
        in: query
        description: Search for columns given an external type
        schema:
          type: string
      - name: search_extra_data_data_type
        required: false
        in: query
        description: Search for columns given a data type
        schema:
          type: string
      - name: search_extra_data_formula
        required: false
        in: query
        description: Search for columns given a formula
