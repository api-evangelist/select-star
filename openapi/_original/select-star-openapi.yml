        description: Include borderline edges linked to tables. Borderline edges -
          edges of which one node is part of this traversal, but the other one isn't
      - in: query
        name: looker_db_lineage
        schema:
          type: boolean
          default: true
        description: Include Looker <-> DB lineage
      - in: query
        name: looker_view_lineage
        schema:
          type: boolean
          default: true
        description: Include looker fields in the lineage calculation
      - in: query
        name: max_depth
        schema:
          type: string
          default: '1'
        description: Can be used to specify max depth of lineage to load. `max` is
          a special value that is used as alias for 20. (1 by default)
      - in: query
        name: mode
        schema:
          type: string
          enum:
          - all
          - column
          - table
