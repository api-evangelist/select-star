          - lookmlfield
          - lookmlview
          - powerbicolumn
          - powerbidataset
          - powerbitable
          - reportquery
          - table
          - tableaucolumn
          - tableaudatasource
          - tableaufield
          - tableautable
          - tableauview
        description: A list of nodes that need to be filtered out of the response
          type
      - in: query
        name: group_by_data_source
        schema:
          type: boolean
          default: false
        description: Group lineage by data source
      - in: path
        name: guid
        schema:
          type: string
          pattern: ^([a-zA-z]{2}_[a-zA-Z0-9]{22})|me|default|([a-zA-z]{2}_[a-zA-Z0-9]{22}).personal$
        required: true
      - in: query
        name: include_borderline_edges
        schema:
          type: boolean
          default: false
        description: Include borderline edges. Borderline edges - edges of which one
          node is part of this traversal, but the other one isn't
      - in: query
        name: include_edge_jobs
        schema:
          type: boolean
          default: false
        description: Include the jobs (DAG/Spark) inside the edge objects responsible
