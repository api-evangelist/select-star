    PiiRule:
      type: object
      properties:
        guid:
          type: string
          maxLength: 25
        name:
          type: string
          description: PII Rule name display name
          maxLength: 50
        type:
          allOf:
          - $ref: '#/components/schemas/PIIType'
          description: 'The type of PII this represents


            * `address` - address

            * `banking` - banking

            * `birthdate` - birthdate

            * `document` - document

            * `email` - email

            * `face_photo` - face_photo

            * `gender` - gender

            * `marital_status` - marital_status

            * `nationality` - nationality

            * `online_account` - online_account

            * `online_address` - online_address

            * `password` - password

            * `person` - person

            * `phone` - phone

            * `salary` - salary

            * `ssn` - ssn

            * `username` - username'
        regex:
          type: string
          description: The PII Rule
        created_by:
          allOf:
          - $ref: '#/components/schemas/UserLite'
          readOnly: true
        active:
          type: boolean
        item_count:
          type: integer
          readOnly: true
      required:
      - created_by
      - item_count
      - name
      - regex
      - type
    DataSourceInfo:
      type: object
