        * `ephemeral` - dbt_ephemeral

        * `source` - dbt_source

        * `seed` - dbt_seed

        * `model` - dbt_model_legacy'
    PaginatedTableRelatedDashboardList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/TableRelatedDashboard'
