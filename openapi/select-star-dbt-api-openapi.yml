openapi: 3.0.3
info:
  title: Select Star Metadata bi dbt API
  version: 1.0.0
  x-role-system:
    description: This API uses role-based access control
    roles:
      admin: Full access to all operations
      data_manager: Can modify data and configurations
      user: Read-only access to most resources
  description: API for interacting with the Select Star system
  termsOfService: https://www.selectstar.com/terms-of-service
  contact:
    email: support@selectstar.com
  license:
    name: All Rights Reserved
tags:
- name: dbt
paths:
  /v1/dbt/project/:
    get:
      operationId: dbt_project_list
      parameters:
      - name: data_source
        required: false
        in: query
        description: A comma separated list of data source guids to filter for items within those data sources.
        schema:
          type: string
          pattern: ^(ds)_(?P<guid>[23456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz]{22})$
      - name: order
        required: false
        in: query
        description: "Specify the ordering for the results. \n\n A comma separated list for ordering by multiple fields and a preceding `-` indicates reverse order. \n\nNote: Order is case-sensitive."
        schema:
          type: string
          enum:
          - name
          - updated_on
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search_name
        required: false
        in: query
        description: Search for an asset using its name
        schema:
          type: string
      tags:
      - dbt
      security:
      - JWTAuthentication: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDbtProjectList'
          description: ''
      description: '**Required Role:** Admin (or RBAC policy)'
      x-role-requirements: Admin (or RBAC policy)
    post:
      operationId: dbt_project_create
      tags:
      - dbt
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DbtProjectRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DbtProjectRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DbtProjectRequest'
        required: true
      security:
      - JWTAuthentication: []
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DbtProject'
          description: ''
      description: '**Required Role:** Admin (or RBAC policy)'
      x-role-requirements: Admin (or RBAC policy)
  /v1/dbt/project/{guid}/:
    get:
      operationId: dbt_project_retrieve
      parameters:
      - in: path
        name: guid
        schema:
          type: string
        required: true
      tags:
      - dbt
      security:
      - JWTAuthentication: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DbtProject'
          description: ''
      description: '**Required Role:** Admin (or RBAC policy)'
      x-role-requirements: Admin (or RBAC policy)
    put:
      operationId: dbt_project_update
      parameters:
      - in: path
        name: guid
        schema:
          type: string
        required: true
      tags:
      - dbt
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DbtProjectRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DbtProjectRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DbtProjectRequest'
        required: true
      security:
      - JWTAuthentication: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DbtProject'
          description: ''
      description: '**Required Role:** Admin (or RBAC policy)'
      x-role-requirements: Admin (or RBAC policy)
    patch:
      operationId: dbt_project_partial_update
      parameters:
      - in: path
        name: guid
        schema:
          type: string
        required: true
      tags:
      - dbt
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedDbtProjectRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedDbtProjectRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedDbtProjectRequest'
      security:
      - JWTAuthentication: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DbtProject'
          description: ''
      description: '**Required Role:** Admin (or RBAC policy)'
      x-role-requirements: Admin (or RBAC policy)
    delete:
      operationId: dbt_project_destroy
      parameters:
      - name: data_source
        required: false
        in: query
        description: A comma separated list of data source guids to filter for items within those data sources.
        schema:
          type: string
          pattern: ^(ds)_(?P<guid>[23456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz]{22})$
      - in: path
        name: guid
        schema:
          type: string
        required: true
      - name: order
        required: false
        in: query
        description: "Specify the ordering for the results. \n\n A comma separated list for ordering by multiple fields and a preceding `-` indicates reverse order. \n\nNote: Order is case-sensitive."
        schema:
          type: string
          enum:
          - name
          - updated_on
      - name: search_name
        required: false
        in: query
        description: Search for an asset using its name
        schema:
          type: string
      tags:
      - dbt
      security:
      - JWTAuthentication: []
      - tokenAuth: []
      responses:
        '204':
          description: No response body
      description: '**Required Role:** Admin (or RBAC policy)'
      x-role-requirements: Admin (or RBAC policy)
  /v1/dbt/warehouse-link/:
    get:
      operationId: dbt_warehouse_link_list
      parameters:
      - name: order
        required: false
        in: query
        description: "Specify the ordering for the results. \n\n A comma separated list for ordering by multiple fields and a preceding `-` indicates reverse order. \n\nNote: Order is case-sensitive."
        schema:
          type: string
          enum:
          - data_source
          - name
          - type
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search_data_source
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - name: search_name
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - name: search_type
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - name: types
        required: false
        in: query
        description: A comma separated list of table types to filter for dbt dwh links.
        schema:
          type: string
          enum:
          - dynamic_table
          - ephemeral
          - external_table
          - incremental
          - materialized_view
          - model
          - seed
          - source
          - table
          - view
      tags:
      - dbt
      security:
      - JWTAuthentication: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDbtWarehouseLinkList'
          description: ''
      description: '**Required Role:** Authenticated User with Active Organization'
      x-role-requirements: Authenticated User with Active Organization
  /v1/dbt/warehouse-link/{guid}/:
    get:
      operationId: dbt_warehouse_link_retrieve
      parameters:
      - in: path
        name: guid
        schema:
          type: string
          pattern: ^([a-zA-z]{2}_[a-zA-Z0-9]{22})|me|default|([a-zA-z]{2}_[a-zA-Z0-9]{22}).personal$
        required: true
      tags:
      - dbt
      security:
      - JWTAuthentication: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DbtWarehouseLink'
          description: ''
      description: '**Required Role:** Authenticated User with Active Organization'
      x-role-requirements: Authenticated User with Active Organization
components:
  schemas:
    ConnectionStatusEnum:
      enum:
      - OK
      - WA
      - UN
      - ER
      type: string
      description: '* `OK` - Correct

        * `WA` - Warning

        * `UN` - Unknown

        * `ER` - Error'
    DbtProjectDataSourceRequest:
      type: object
      properties:
        guid:
          type: string
          minLength: 1
        last_ingested_on:
          type: string
          format: date-time
          nullable: true
        connection_status:
          $ref: '#/components/schemas/ConnectionStatusEnum'
        connection_error_message:
          type: string
          minLength: 1
          description: Exception message if health check failed
        external_uuid:
          type: string
          nullable: true
          description: UUID used for running aws cloudformation.
          maxLength: 64
        iam_principal:
          type: string
          nullable: true
          description: IAM Principal used for running aws cloudformation.
          maxLength: 64
      required:
      - guid
    TableLite:
      type: object
      properties:
        guid:
          type: string
          maxLength: 25
        name:
          type: string
        table_type:
          allOf:
          - $ref: '#/components/schemas/TableTypeEnum'
          nullable: true
          description: 'Table type as defined in the datasource


            * `table` - table

            * `view` - view

            * `materialized_view` - materialized_view

            * `external_table` - external_table

            * `dynamic_table` - dynamic_table

            * `incremental` - dbt_incremental

            * `ephemeral` - dbt_ephemeral

            * `source` - dbt_source

            * `seed` - dbt_seed

            * `model` - dbt_model_legacy'
        data_types:
          allOf:
          - $ref: '#/components/schemas/BaseType'
          readOnly: true
        updated_on:
          type: string
          format: date-time
          readOnly: true
      required:
      - data_types
      - name
      - updated_on
    DbtTypeEnum:
      enum:
      - both
      - cloud
      - core
      - empty
      type: string
      description: '* `both` - Both

        * `cloud` - Cloud

        * `core` - Core

        * `empty` - Empty'
