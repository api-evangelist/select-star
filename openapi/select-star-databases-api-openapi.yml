        search_name:
          type: string
          readOnly: true
        description_source:
          allOf:
          - $ref: '#/components/schemas/DescriptionSourceEnum'
          nullable: true
        user_description:
          type: string
          nullable: true
          description: User description
        user_description_author:
          allOf:
          - $ref: '#/components/schemas/UserLite'
          readOnly: true
        ingested_description:
          type: string
          nullable: true
          description: Unmodified description from the data source
        ai_description:
          type: string
          nullable: true
          description: AI-generated description
        richtext_description:
          type: string
          nullable: true
          description: Richtext formatted description. Can be in Slatejs or Draftjs format.
        dashboard_created_at:
          type: string
          format: date-time
          nullable: true
          description: The creation date ingested from API
        dashboard_updated_at:
          type: string
          format: date-time
          nullable: true
          description: The updation date ingested from API
        last_successful_run:
          type: string
          format: date-time
          nullable: true
          description: The last date where the dashboard was successfully run at
        was_last_run_successful:
          type: boolean
          nullable: true
          description: Was the last run to this dashboard successful at the time we ingested?
        last_run_at:
          type: string
          format: date-time
          nullable: true
          description: The last date where the dashboard was attempted to run at
        query_count:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        chart_count:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        runs_count:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        view_count:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        dsuser_created_by:
          $ref: '#/components/schemas/DSUser'
        top_dsuser:
          $ref: '#/components/schemas/DSUser'
        dsuser_owned_by:
          $ref: '#/components/schemas/DSUser'
        business_owner:
          $ref: '#/components/schemas/DashboardSerializer.GuidReferenceField.business_owner'
        technical_owner:
          $ref: '#/components/schemas/DashboardSerializer.GuidReferenceField.technical_owner'
        url:
          type: string
          readOnly: true
          nullable: true
          description: 'The full url of the report obtained from the links field. '
        popularity:
          allOf:
          - $ref: '#/components/schemas/DashboardPopularity'
          readOnly: true
        query_errors:
          type: array
          items:
            $ref: '#/components/schemas/QueryError'
        tagged_items:
          type: array
          items:
            $ref: '#/components/schemas/TaggedItemsLiteWithSource'
          readOnly: true
        size:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          nullable: true
          description: Size of dashboard objects in bytes
        full_path:
          type: string
          nullable: true
          description: The cached full path of the dashboard folder
        is_hidden:
          type: boolean
          readOnly: true
        downstream_objects_counts:
          allOf:
          - $ref: '#/components/schemas/RelatedObjectsCounts'
          readOnly: true
        upstream_objects_counts:
          allOf:
          - $ref: '#/components/schemas/RelatedObjectsCounts'
          readOnly: true
        source_tables_count:
          type: integer
          default: 0
        last_query_error:
          $ref: '#/components/schemas/QueryError'
        breadcrumbs:
          type: array
          items:
            $ref: '#/components/schemas/Breadcrumb'
          readOnly: true
        data_types:
          allOf:
          - $ref: '#/components/schemas/BaseType'
          readOnly: true
        raw_sql:
          type: string
          nullable: true
        last_viewed_at:
          type: string
          format: date
        collections:
          type: array
          items:
            $ref: '#/components/schemas/CollectionLite'
          readOnly: true
      required:
      - bifolder
      - breadcrumbs
      - collections
      - data_type
      - data_types
      - downstream_objects_counts
      - is_hidden
      - popularity
      - search_name
      - tagged_items
      - upstream_objects_counts
      - url
      - user_description_author
    BaseType:
      type: object
      description: 'Base Serializer to inject the following `type` information:

        - Object Type: Model Name of the Object: Table, Dashboard, ReportQuery

        - Data Source Type: snowflake, databricks etc.

        - Data Type: Additional type like tile, visual, card etc.'
      properties:
        object_type:
          type: string
          nullable: true
          readOnly: true
        data_source_type:
          type: string
          nullable: true
          readOnly: true
        data_type:
          type: string
          nullable: true
          readOnly: true
        external_database_type:
          type: string
          nullable: true
          readOnly: true
      required:
      - data_source_type
      - data_type
      - external_database_type
      - object_type
    DataSourceInfo:
      type: object
      properties:
        guid:
          type: string
          maxLength: 25
        type:
          $ref: '#/components/schemas/Type6b6Enum'
        name:
          type: string
          maxLength: 100
        last_ingested_on:
          type: string
          format: date-time
          nullable: true
      required:
      - name
      - type
    User:
      type: object
      properties:
        guid:
          type: string
          readOnly: true
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
          pattern: ''
          description: Email address of the user. Only corporate email addresses are allowed.
        avatar:
          type: string
          format: uri
          readOnly: true
          nullable: true
        team:
          allOf:
          - $ref: '#/components/schemas/TeamShortcut'
          readOnly: true
        last_login:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        last_activity:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        is_invitation_pending:
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        is_verified:
          type: boolean
          readOnly: true
          description: Whether the user has verified email or not
        is_agreed_to_terms:
          type: boolean
        settings:
          $ref: '#/components/schemas/UserSetting'
        created_on:
          type: string
          format: date-time
          readOnly: true
      required:
      - avatar
      - created_on
      - email
      - first_name
      - guid
      - is_active
      - is_agreed_to_terms
      - is_invitation_pending
      - is_verified
      - last_activity
      - last_login
      - last_name
      - team
    DefaultDatabaseTableColumnOrderEnum:
      enum:
      - popularity
      - column_ordinal_position
      - alphabetical
      type: string
      description: '* `popularity` - popularity

        * `column_ordinal_position` - column_ordinal_position

        * `alphabetical` - alphabetical'
    DSUser:
      type: object
      properties:
        guid:
          type: string
          readOnly: true
        data_source:
          $ref: '#/components/schemas/DataSourceInfo'
        user:
          allOf:
          - $ref: '#/components/schemas/User'
          nullable: true
        name:
          type: string
          readOnly: true
        display_name:
          type: string
          readOnly: true
          nullable: true
          description: The username field for the user used by the datasource
        email:
          type: string
          readOnly: true
          nullable: true
          description: The email of the dsuser that is used to identify the unique ds user from Mode. This is crucial as chances of display_name from the QP and ModeIngestion being different are possible.
        is_active:
          type: boolean
          description: An object wasn't deactivated or was deactivated less than 1 day ago
          readOnly: true
        is_service_account:
          type: boolean
        is_mode_service_account:
          type: boolean
          description: If true, any queries run by this DSUser user name will be processed by Query Parser BI Mode extension.
        is_periscope_service_account:
          type: boolean
          description: If true, any queries run by this DSUser user name will be processed by Query Parser BI Periscope extension.
        is_sigma_service_account:
          type: boolean
          description: If true, any queries run by this DSUser user name will be processed by Query Parser BI Sigma extension.
        data_types:
          allOf:
          - $ref: '#/components/schemas/BaseType'
          readOnly: true
        deactivation_scheduled_on:
          type: string
          format: date-time
          nullable: true
          description: A time when objects is fully deactivated, so deactivate grace period pass too
          readOnly: true
      required:
      - data_source
      - data_types
      - deactivation_scheduled_on
      - display_name
      - email
      - guid
      - is_active
      - name
    BIFolder:
