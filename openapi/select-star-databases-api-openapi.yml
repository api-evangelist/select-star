      - breadcrumbs
      - color
      - icon
      - name
      - type
      - visible
    Dashboard:
      type: object
      description: 'Adds support for reading a description from metadata

        that support modifying description'
      properties:
        guid:
          type: string
          maxLength: 25
        bifolder:
          $ref: '#/components/schemas/BIFolder'
        name:
          type: string
          nullable: true
        data_type:
          type: string
          readOnly: true
        description:
          type: string
          nullable: true
