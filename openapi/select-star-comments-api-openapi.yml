openapi: 3.0.3
info:
  title: Select Star Metadata bi comments API
  version: 1.0.0
  x-role-system:
    description: This API uses role-based access control
    roles:
      admin: Full access to all operations
      data_manager: Can modify data and configurations
      user: Read-only access to most resources
  description: API for interacting with the Select Star system
  termsOfService: https://www.selectstar.com/terms-of-service
  contact:
    email: support@selectstar.com
  license:
    name: All Rights Reserved
tags:
- name: comments
paths:
  /v1/comments/:
    get:
      operationId: comments_list
      parameters:
      - name: commented_on
        required: false
        in: query
        description: "Filter objects by commented_on. May specify __gt, __gte, __lt or __lte.\n\n API call to: \n\n ENDPOINT/commented_on__gt=2021-08-04T15:12:40&commented_on__lt=2021-08-23 \n\n will result with objects commented_on after  August 4th 2021 at 15:12:40, but before August 23rd 2021. \n\n. If you want to include lower or upper bound of the range use __gte or __lte respectively."
        schema:
          type: string
      - name: order
        required: false
        in: query
        description: "Specify the ordering for the results. \n\n A comma separated list for ordering by multiple fields and a preceding `-` indicates reverse order. \n\nNote: Order is case-sensitive."
        schema:
          type: string
          enum:
          - commented_on
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search_comment
        required: false
        in: query
        description: Filter comments by the message.
        schema:
          type: string
      - name: search_commented_by
        required: false
        in: query
        description: Filter comments by the author.
        schema:
          type: string
      - name: search_target
        required: false
        in: query
        description: Filter comments by the commented object name.
        schema:
          type: string
      tags:
      - comments
      security:
      - JWTAuthentication: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCommentList'
          description: ''
      description: '**Required Role:** Data Manager or Admin (or RBAC policy)'
      x-role-requirements: Data Manager or Admin (or RBAC policy)
components:
  schemas:
    TypeB32Enum:
      enum:
      - status
      - dbt
      type: string
      description: '* `status` - status

        * `dbt` - dbt'
    UserListTypeEnum:
      enum:
      - downstream_owners
      - top_users
      type: string
      description: '* `downstream_owners` - downstream_owners

        * `top_users` - top_users'
    BaseDataSource:
      type: object
      properties:
        guid:
          type: string
          maxLength: 25
        type:
          $ref: '#/components/schemas/Type6b6Enum'
        name:
          type: string
          maxLength: 100
      required:
      - name
      - type
    Explore:
      type: object
      description: 'Adds support for reading a description from metadata

        that support modifying description'
      properties:
        guid:
          type: string
          maxLength: 25
        lookml_model:
          $ref: '#/components/schemas/LookMLModel'
        name:
          type: string
        label:
          type: string
        group_label:
          type: string
          nullable: true
          description: The custom group_label for Explore (if any)
        group:
          $ref: '#/components/schemas/ExploreGroup'
        description:
          type: string
          nullable: true
          description: Active description
        description_source:
          allOf:
          - $ref: '#/components/schemas/DescriptionSourceEnum'
          nullable: true
        user_description:
          type: string
          nullable: true
          description: User description
        user_description_author:
          allOf:
          - $ref: '#/components/schemas/UserLite'
          readOnly: true
        ai_description:
          type: string
          nullable: true
          description: AI-generated description
        ingested_description:
          type: string
          nullable: true
          description: Unmodified description from the data source
        richtext_description:
          type: string
          nullable: true
          description: Richtext formatted description. Can be in Slatejs or Draftjs format.
        project_name:
          type: string
          nullable: true
          description: Name of project containing the model
        business_owner:
          $ref: '#/components/schemas/ExploreSerializer.GuidReferenceField.business_owner'
        technical_owner:
          $ref: '#/components/schemas/ExploreSerializer.GuidReferenceField.technical_owner'
        popularity:
          allOf:
          - $ref: '#/components/schemas/LookerExplorePopularity'
          readOnly: true
        url:
          type: string
          format: uri
          nullable: true
          description: The full url of the explore generated from the ingestion
          maxLength: 200
        tagged_items:
          type: array
          items:
            $ref: '#/components/schemas/TaggedItemsLiteWithSource'
          readOnly: true
        is_hidden:
          type: boolean
          readOnly: true
        data_source_type:
          type: string
          readOnly: true
        search_name:
          type: string
          readOnly: true
        downstream_objects_counts:
          allOf:
          - $ref: '#/components/schemas/RelatedObjectsCounts'
          readOnly: true
        upstream_objects_counts:
          allOf:
          - $ref: '#/components/schemas/RelatedObjectsCounts'
          readOnly: true
        breadcrumbs:
          type: array
          items:
            $ref: '#/components/schemas/Breadcrumb'
          readOnly: true
        data_types:
          allOf:
          - $ref: '#/components/schemas/BaseType'
          readOnly: true
        collections:
          type: array
          items:
            $ref: '#/components/schemas/CollectionLite'
          readOnly: true
      required:
      - breadcrumbs
      - collections
      - data_source_type
      - data_types
      - downstream_objects_counts
      - group
      - is_hidden
      - label
      - lookml_model
      - name
      - popularity
      - search_name
      - tagged_items
      - upstream_objects_counts
      - user_description_author
    UserList:
      type: object
      properties:
        guid:
          type: string
          maxLength: 25
        user_list_type:
          allOf:
          - $ref: '#/components/schemas/UserListTypeEnum'
          description: 'User List type that determines how the list is calculated.


            * `downstream_owners` - downstream_owners

            * `top_users` - top_users'
        name:
          type: string
          description: User list display name
          maxLength: 30
        target_types:
          type: array
          items:
            $ref: '#/components/schemas/TargetTypesEnum'
          description: List of target object types this UserList applies to.
        user_type:
          allOf:
          - $ref: '#/components/schemas/UserTypeEnum'
          description: 'User type that determines what type of users are in the list.


            * `user` - user

            * `table` - table

            * `bi` - bi

            * `team` - team

            * `any` - any'
      required:
      - name
      - user_list_type
    TaggedItemsSourceSerializer.GuidReferenceField.item:
      $ref: '#/components/schemas/BaseMetadata'
    BaseMetadata:
      type: object
      properties:
        object_type:
          type: string
          readOnly: true
        guid:
          type: string
          readOnly: true
        name:
          type: string
          nullable: true
          readOnly: true
        breadcrumbs:
          type: array
          items:
            $ref: '#/components/schemas/Breadcrumb'
          readOnly: true
      required:
      - breadcrumbs
      - guid
      - name
      - object_type
    TaggedItemsLite:
      type: object
      description: Serializer without suggestion source
      properties:
        item:
          $ref: '#/components/schemas/TaggedItemsLiteSerializer.GuidReferenceField.item'
        guid:
          type: string
          readOnly: true
        tag:
          $ref: '#/components/schemas/TagLite'
        kind:
          type: string
        suggested_source_kind:
          type: string
      required:
      - guid
      - item
      - kind
      - suggested_source_kind
      - tag
    Breadcrumb:
      type: object
      properties:
        guid:
          type: string
          maxLength: 25
        target_guid:
          type: string
          maxLength: 256
        target_name:
          type: string
          readOnly: true
        target_object_type:
          type: string
        target_data_type:
          type: string
        target_data_source_guid:
          type: string
          nullable: true
          readOnly: true
        target_data_source_type:
          allOf:
          - $ref: '#/components/schemas/TargetDataSourceTypeEnum'
          nullable: true
        ordinal:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Ordering of breadcrumb within the table
      required:
      - target_data_source_guid
      - target_data_type
      - target_guid
      - target_name
      - target_object_type
    DescriptionSourceEnum:
      enum:
      - user
      - ingestion
      - ai
      - public_docs
      - lineage
      - downstream_lineage
      - upstream_lineage
      - similarity
      - unknown
      type: string
      description: '* `user` - User

        * `ingestion` - Ingestion

        * `ai` - Ai

        * `public_docs` - Public Docs

        * `lineage` - Lineage

        * `downstream_lineage` - Downstream Lineage

        * `upstream_lineage` - Upstream Lineage

        * `similarity` - Similarity

        * `unknown` - Unknown'
    Metadata:
      type: object
      description: 'Adds support for reading a description from metadata

        that support modifying description'
      properties:
        suggested_description:
          type: string
          nullable: true
          description: 'Suggested description coming from lineage, similar table, or public docs.


            When `force_showing_suggested_description` query parameter value is `false`,

            suggested description is returned only if there is no user or ingested description.'
          readOnly: true
        suggested_description_source:
          type: string
          nullable: true
          readOnly: true
        suggested_description_source_object:
          allOf:
          - $ref: '#/components/schemas/SuggestedDescriptionSourceObject'
          readOnly: true
        data_types:
          allOf:
          - $ref: '#/components/schemas/BaseType'
          readOnly: true
        object_type:
          type: string
          readOnly: true
        guid:
          type: string
          readOnly: true
        name:
          type: string
          nullable: true
          readOnly: true
        short_name:
          type: string
          readOnly: true
        description:
          type: string
          default: ''
        description_source:
          allOf:
          - $ref: '#/components/schemas/DescriptionSourceEnum'
          description: 'The source of the active description.


            * `user` - User

            * `ingestion` - Ingestion

            * `ai` - Ai

            * `public_docs` - Public Docs

            * `lineage` - Lineage

            * `downstream_lineage` - Downstream Lineage

            * `upstream_lineage` - Upstream Lineage

            * `similarity` - Similarity

            * `unknown` - Unknown'
        user_description:
          type: string
          readOnly: true
        user_description_author:
          allOf:
          - $ref: '#/components/schemas/UserLite'
          readOnly: true
        ingested_description:
          type: string
          readOnly: true
        ai_description:
          type: string
          readOnly: true
        search_name:
          type: string
          readOnly: true
          default: ''
        data_type:
          type: string
          readOnly: true
          default: ''
        external_type:
          type: string
          readOnly: true
          default: ''
        data_source:
          allOf:
          - $ref: '#/components/schemas/BaseDataSource'
          readOnly: true
        data_source_type:
          type: string
          nullable: true
          readOnly: true
          default: ''
        url:
          type: string
          format: uri
          readOnly: true
        parent_guid:
          type: string
          readOnly: true
        last_updated_on:
          type: string
          format: date-time
          readOnly: true
        is_hidden:
          type: boolean
          readOnly: true
        breadcrumbs:
          type: array
          items:
            $ref: '#/components/schemas/Breadcrumb'
          readOnly: true
        richtext_description:
          type: string
          default: ''
          description: Rich text version of `description` using SlateJS or Markdown format.
      required:
      - ai_description
      - breadcrumbs
      - data_source
      - data_source_type
      - data_type
      - data_types
      - external_type
      - guid
      - ingested_description
      - is_hidden
      - last_updated_on
      - name
      - object_type
      - parent_guid
      - search_name
      - short_name
      - suggested_description
      - suggested_description_source
      - suggested_description_source_object
      - url
      - user_description
      - user_description_author
    TargetTypesEnum:
      enum:
      - table
      - dashboard
      - explore
      - lookmlview
      type: string
      description: '* `table` - table

        * `dashboard` - dashboard

        * `explore` - explore

        * `lookmlview` - lookmlview'
    Comment:
      type: object
      properties:
        guid:
          type: string
          readOnly: true
        data_types:
          allOf:
          - $ref: '#/components/schemas/BaseType'
          readOnly: true
        message:
          type: string
          nullable: true
          description: The plain text version of the message for searching of comments
        richtext_message:
          type: string
          description: The richtext version of the message in slatejs or draftjs format
        commented_by:
          allOf:
          - $ref: '#/components/schemas/UserLite'
          readOnly: true
        commented_on:
          type: string
          format: date-time
          readOnly: true
        target:
          $ref: '#/components/schemas/CommentSerializer.GuidReferenceField.target'
        replies:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
          readOnly: true
        in_reply_to:
          $ref: '#/components/schemas/Comment'
        pinned_at:
          type: string
          format: date-time
          nullable: true
          description: When and if this field was pinned. Useful if there's multiple pinned comments.
        pinned:
          type: boolean
        comment_recipients:
          type: array
          items:
            $ref: '#/components/schemas/CommentRecipient'
      required:
      - commented_by
      - commented_on
      - data_types
      - guid
      - replies
      - richtext_message
      - target
    CommentRecipientSerializer.GuidReferenceField.recipient:
      anyOf:
      - $ref: '#/components/schemas/Team'
      - $ref: '#/components/schemas/UserList'
      - $ref: '#/components/schemas/UserLite'
      discriminator:
        propertyName: object_type
        mapping:
          team: '#/components/schemas/Team'
          user: '#/components/schemas/UserLite'
          userlist: '#/components/schemas/UserList'
    LookMLModel:
      type: object
      properties:
        guid:
          type: string
          maxLength: 25
        data_source:
          $ref: '#/components/schemas/DataSource'
        name:
          type: string
          maxLength: 255
        label:
          type: string
          maxLength: 255
        project_name:
          type: string
          nullable: true
          description: Name of project containing the model
          maxLength: 255
      required:
      - data_source
      - label
      - name
    TargetDataSourceTypeEnum:
      enum:
      - airflow
      - aws_s3
      - bigquery
      - data_studio
      - databricks
      - db_agent
      - db2
      - dbt
      - fivetran
      - glue
      - hex
      - looker
      - metabase
      - mode
      - monte_carlo
      - mssql
      - mysql
      - omni
      - openlineage
      - oracle
      - periscope
      - postgres
      - power_bi
      - quicksight
      - redshift
      - salesforce
      - salesforce_crma
      - sigma
      - snowflake
      - tableau
      - thoughtspot
      - trial
      - trial_redshift
      type: string
      description: '* `airflow` - Airflow

        * `aws_s3` - AWS S3

        * `bigquery` - BigQuery

        * `data_studio` - Looker Studio

        * `databricks` - Databricks

        * `db_agent` - DB Agent

        * `db2` - DB2

        * `dbt` - dbt

        * `fivetran` - Fivetran

        * `glue` - Glue

        * `hex` - Hex

        * `looker` - Looker

        * `metabase` - Metabase

        * `mode` - Mode

        * `monte_carlo` - Monte Carlo

        * `mssql` - MS SQL

        * `mysql` - MySQL

        * `omni` - Omni BI

        * `openlineage` - Open Lineage

        * `oracle` - Oracle

        * `periscope` - Periscope

        * `postgres` - PostgreSQL

        * `power_bi` - Power BI

        * `quicksight` - QuickSight

        * `redshift` - Redshift

        * `salesforce` - Salesforce

        * `salesforce_crma` - Salesforce Analytics

        * `sigma` - Sigma

        * `snowflake` - Snowflake

        * `tableau` - Tableau

        * `thoughtspot` - ThoughtSpot

        * `trial` - Trial

        * `trial_redshift` - Trial Redshift'
    TaggedItemsLiteWithSourceSerializer.GuidReferenceField.suggestion_source_object:
      anyOf:
      - $ref: '#/components/schemas/PiiRule'
      - $ref: '#/components/schemas/TaggedItemsLite'
      discriminator:
        propertyName: object_type
        mapping:
          piirule: '#/components/schemas/PiiRule'
          taggeditems: '#/components/schemas/TaggedItemsLite'
    LookerExplorePopularity:
      type: object
      properties:
        timeframe:
          type: integer
          readOnly: true
          default: 90
        user_count:
          type: integer
          readOnly: true
        service_query_count:
          type: integer
          readOnly: true
        popularity:
          type: integer
          readOnly: true
          description: Popularity score for this object from 0-100
        query_count:
          type: integer
      required:
      - popularity
      - query_count
      - service_query_count
      - timeframe
      - user_count
    ProcessedThrough:
      type: object
      properties:
        start_time:
          type: array
          items:
            $ref: '#/components/schemas/ProcessedThroughEntry'
      required:
      - start_time
    UserTypeEnum:
      enum:
      - user
      - table
      - bi
      - team
      - any
      type: string
      description: '* `user` - user

        * `table` - table

        * `bi` - bi

        * `team` - team

        * `any` - any'
    UserLite:
      type: object
      properties:
        guid:
          type: string
          readOnly: true
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
        team:
          allOf:
          - $ref: '#/components/schemas/TeamShortcut'
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
          title: Email address
        avatar:
          type: string
          format: uri
          readOnly: true
          nullable: true
        is_active:
          type: boolean
          readOnly: true
      required:
      - avatar
      - email
      - first_name
      - guid
      - is_active
      - last_name
      - team
    CollectionLite:
      type: object
      properties:
        guid:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
        icon:
          type: string
          readOnly: true
        data_types:
          allOf:
          - $ref: '#/components/schemas/BaseType'
          readOnly: true
        breadcrumbs:
          type: array
          items:
            $ref: '#/components/schemas/Breadcrumb'
          readOnly: true
        emoji:
          type: string
          readOnly: true
          nullable: true
          description: Unicode representation of the selected emoji
        color_scheme:
          type: string
          readOnly: true
          nullable: true
          description: Color scheme selected by the user for the icon
        linked_from:
          type: array
          items:
            type: string
          readOnly: true
          description: Tags having a link to this collection
      required:
      - breadcrumbs
      - color_scheme
      - data_types
      - emoji
      - guid
      - icon
      - linked_from
      - name
    DSUserName:
      type: object
      properties:
        guid:
          type: string
          maxLength: 25
        display_name:
          type: string
          nullable: true
          description: The username field for the user used by the datasource
          maxLength: 100
        name:
          type: string
          maxLength: 100
        data_source:
          $ref: '#/components/schemas/DataSourceInfo'
      required:
      - data_source
      - name
    DataSource:
      type: object
      properties:
        guid:
          type: string
          readOnly: true
        type:
          $ref: '#/components/schemas/Type6b6Enum'
        name:
          type: string
          maxLength: 100
        keypair:
          $ref: '#/components/schemas/KeyPair'
        last_ingested_on:
          type: string
          format: date-time
          nullable: true
        last_fully_ingested_on:
          type: string
          format: date-time
          readOnly: true
        is_ingesting:
          type: boolean
          readOnly: true
        is_syncing_paused:
          type: boolean
          readOnly: true
        connection_status:
          $ref: '#/components/schemas/ConnectionStatusEnum'
        connection_error_message:
          type: string
          description: Exception message if health check failed
        is_mode_discovery_db_added:
          type: boolean
          readOnly: true
        external_uuid:
          type: string
          nullable: true
          description: UUID used for running aws cloudformation.
          maxLength: 64
        iam_principal:
          type: string
          nullable: true
          description: IAM Principal used for running aws cloudformation.
          maxLength: 64
        cloudformation_url:
          type: object
          additionalProperties:
            type: string
          nullable: true
          readOnly: true
        is_credentials_setup_incomplete:
          type: boolean
          readOnly: true
        processed_through:
          $ref: '#/components/schemas/ProcessedThrough'
        data_types:
          allOf:
          - $ref: '#/components/schemas/BaseType'
          readOnly: true
      required:
      - cloudformation_url
      - data_types
      - guid
      - is_credentials_setup_incomplete
      - is_ingesting
      - is_mode_discovery_db_added
      - is_syncing_paused
      - last_fully_ingested_on
      - name
      - type
    CommentSerializer.GuidReferenceField.target:
      anyOf:
      - $ref: '#/components/schemas/Explore'
      - $ref: '#/components/schemas/Metadata'
      - $ref: '#/components/schemas/TagLite'
      - $ref: '#/components/schemas/Team'
      discriminator:
        propertyName: object_type
        mapping:
          bidataset: '#/components/schemas/Metadata'
          bifolder: '#/components/schemas/Metadata'
          collection: '#/components/schemas/Metadata'
          conversationevaluation: '#/components/schemas/Metadata'
          dashboard: '#/components/schemas/Metadata'
          document: '#/components/schemas/Metadata'
          explore: '#/components/schemas/Explore'
          job: '#/components/schemas/Metadata'
          lookmlview: '#/components/schemas/Metadata'
          metabasetable: '#/components/schemas/Metadata'
          metric: '#/components/schemas/Metadata'
          notebook: '#/components/schemas/Metadata'
          powerbidataset: '#/components/schemas/Metadata'
          table: '#/components/schemas/Metadata'
          tableaudatasource: '#/components/schemas/Metadata'
          tableaufield: '#/components/schemas/Metadata'
          tableauview: '#/components/schemas/Metadata'
          tag: '#/components/schemas/TagLite'
          team: '#/components/schemas/Team'
          term: '#/components/schemas/Metadata'
          thoughtspottable: '#/components/schemas/Metadata'
    ExploreSerializer.GuidReferenceField.technical_owner:
      anyOf:
      - $ref: '#/components/schemas/DSUserName'
      - $ref: '#/components/schemas/Team'
      - $ref: '#/components/schemas/UserLite'
      discriminator:
        propertyName: object_type
        mapping:
          dsuser: '#/components/schemas/DSUserName'
          team: '#/components/schemas/Team'
          user: '#/components/schemas/UserLite'
    TaggedItemsLiteSerializer.GuidReferenceField.item:
      $ref: '#/components/schemas/BaseMetadata'
    PiiRule:
      type: object
      properties:
        guid:
          type: string
          maxLength: 25
        name:
          type: string
          description: PII Rule name display name
          maxLength: 50
        type:
          allOf:
          - $ref: '#/components/schemas/PIIType'
          description: 'The type of PII this represents


            * `address` - address

            * `banking` - banking

            * `birthdate` - birthdate

            * `document` - document

            * `email` - email

            * `face_photo` - face_photo

            * `gender` - gender

            * `marital_status` - marital_status

            * `nationality` - nationality

            * `online_account` - online_account

            * `online_address` - online_address

            * `password` - password

