          readOnly: true
        tag:
          $ref: '#/components/schemas/TagLite'
        kind:
          type: string
        suggested_source_kind:
          type: string
        suggestion_source:
          $ref: '#/components/schemas/TaggedItemsSource'
        suggestion_source_object:
          $ref: '#/components/schemas/TaggedItemsLiteWithSourceSerializer.GuidReferenceField.suggestion_source_object'
      required:
      - guid
      - kind
      - suggested_source_kind
      - suggestion_source_object
      - tag
    DashboardElement:
      type: object
      description: 'Adds support for reading a description from metadata

        that support modifying description'
      properties:
        guid:
          type: string
          maxLength: 25
        external_id:
          type: string
          description: External unique identifier of this resource
        name:
          type: string
          description: Fully-qualified name of the measure
          maxLength: 255
        description:
          type: string
          nullable: true
          description: Active description
        description_source:
          allOf:
          - $ref: '#/components/schemas/DescriptionSourceEnum'
          nullable: true
        user_description:
          type: string
          nullable: true
          description: User description
        user_description_author:
          allOf:
          - $ref: '#/components/schemas/UserLite'
          readOnly: true
        ingested_description:
          type: string
          nullable: true
          description: Unmodified description from the data source
        ai_description:
          type: string
          nullable: true
          description: AI-generated description
        richtext_description:
          type: string
          nullable: true
          description: Richtext formatted description. Can be in Slatejs or Draftjs format.
        data_type:
          type: string
          description: Map external_type to the Select Star type
          readOnly: true
        external_type:
          type: string
          description: The LookML type of the dashboard element
          maxLength: 255
        breadcrumbs:
          type: array
          items:
            $ref: '#/components/schemas/Breadcrumb'
          readOnly: true
        search_name:
          type: string
          readOnly: true
        url:
          type: string
          format: uri
          nullable: true
          description: The share url of a looker dashboard element obtained from the REST endpoint from the Looker sdk
          maxLength: 200
        tagged_items:
          type: array
          items:
            $ref: '#/components/schemas/TaggedItemsLiteWithSource'
          readOnly: true
        popularity:
          allOf:
          - $ref: '#/components/schemas/DashboardPopularity'
          readOnly: true
        data_types:
          allOf:
          - $ref: '#/components/schemas/BaseType'
          readOnly: true
      required:
      - breadcrumbs
      - data_type
      - data_types
      - external_id
      - external_type
      - name
      - popularity
      - search_name
      - tagged_items
      - user_description_author
    DashboardPopularity:
      type: object
      properties:
        timeframe:
          type: integer
          readOnly: true
          default: 90
        user_count:
          type: integer
          readOnly: true
        service_query_count:
          type: integer
          readOnly: true
        popularity:
          type: integer
          readOnly: true
          description: Popularity score for this object from 0-100
        view_count:
          type: integer
      required:
      - popularity
      - service_query_count
      - timeframe
      - user_count
      - view_count
    ViewTypeEnum:
      enum:
      - dashboard
      - sheet
      - unknown
      type: string
      description: '* `dashboard` - dashboard

        * `sheet` - sheet

        * `unknown` - unknown'
    SuggestedDescriptionSourceObject:
      type: object
      properties:
        object_type:
          type: string
          readOnly: true
        guid:
          type: string
          readOnly: true
        name:
          type: string
          nullable: true
          readOnly: true
        breadcrumbs:
          type: array
          items:
            $ref: '#/components/schemas/Breadcrumb'
          readOnly: true
        data_types:
          allOf:
          - $ref: '#/components/schemas/BaseType'
          readOnly: true
        parent_guid:
          type: string
      required:
      - breadcrumbs
      - data_types
      - guid
      - name
      - object_type
    ProcessedThroughEntry:
      type: object
      properties:
        key:
          type: string
          readOnly: true
        date:
          type: string
          format: date-time
          readOnly: true
      required:
      - date
      - key
    DashboardOwnersBulkEditSerializer.GuidReferenceField.technical_owner:
      anyOf:
      - $ref: '#/components/schemas/DSUserName'
      - $ref: '#/components/schemas/Team'
      - $ref: '#/components/schemas/UserLite'
      discriminator:
        propertyName: object_type
        mapping:
          dsuser: '#/components/schemas/DSUserName'
          team: '#/components/schemas/Team'
          user: '#/components/schemas/UserLite'
  securitySchemes:
    JWTAuthentication:
      type: http
      scheme: bearer
      bearerFormat: JWT
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
externalDocs:
  description: Select Star API reference documentation
